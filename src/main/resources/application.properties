# ?? Server ??????????????????????????????????????????????????????????????????
server.port=${PORT:8080}

# ?? Groq API ?????????????????????????????????????????????????????????????????
groq.api.key=${GROQ_API_KEY:dummy-key-for-local}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
groq.api.max-tokens=4000

# ?? Jackson ??????????????????????????????????????????????????????????????????
spring.jackson.default-property-inclusion=non_null

# ?? Logging ??????????????????????????????????????????????????????????????????
logging.level.com.formfit=INFO
logging.level.org.springframework.web=INFO

# ?? WebFlux ??????????????????????????????????????????????????????????????????
spring.main.web-application-type=servlet

jwt.secret=${JWT_SECRET:localSecretKey123456789012345678901234567890123456}
jwt.expiration=86400000

# Database
spring.h2.console.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.sslmode=require